# RAGuard Nginx Configuration
# Add this to your nginx sites-available or include in nginx.conf

upstream ragaurd_upstream {
    server ragaurd-app:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name ragaurd.com www.ragaurd.com;

    # Redirect HTTP to HTTPS (if not handled by Cloudflare)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ragaurd.com www.ragaurd.com;

    # SSL Configuration (if using local certs, not Cloudflare Full)
    # ssl_certificate /etc/nginx/ssl/ragaurd.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/ragaurd.com.key;

    # If using Cloudflare Origin Certificate
    # ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # Security headers (additional to Next.js headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy settings
    location / {
        proxy_pass http://ragaurd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # API routes - no caching
    location /api/ {
        proxy_pass http://ragaurd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # No caching for API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://ragaurd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://ragaurd_upstream/api/v1/defend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
